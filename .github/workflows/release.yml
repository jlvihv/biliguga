name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev \
            libjemalloc-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config \
            rpm

      - name: Install Windows libmpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-(?!v3-).*\.7z$' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
          }
          if (-not $asset) { throw 'No x86_64 mpv-dev asset found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\mpv-dev.7z"
          $extract = "$env:RUNNER_TEMP\mpv-dev"
          7z x "$env:RUNNER_TEMP\mpv-dev.7z" -o"$extract" -y | Out-Null
          $root = Get-Item $extract
          if (-not (Test-Path "$root\libmpv.dll.a")) {
            $root = Get-ChildItem $extract -Directory |
              Where-Object { Test-Path "$($_.FullName)\libmpv.dll.a" } |
              Select-Object -First 1
          }
          if (-not $root) {
            Get-ChildItem $extract -Recurse -File | Select-Object -First 80 | ForEach-Object FullName
            throw 'Could not locate libmpv.dll.a in the extracted mpv development package'
          }
          New-Item -ItemType Directory -Force "$($root.FullName)\lib" | Out-Null
          $exports = llvm-nm --extern-only --defined-only "$($root.FullName)\libmpv.dll.a" |
            ForEach-Object {
              $parts = $_ -split '\s+'
              if ($parts.Length -ge 3 -and $parts[2] -match '^mpv_') { $parts[2] }
            } | Sort-Object -Unique
          @('LIBRARY libmpv-2.dll', 'EXPORTS') + $exports |
            Set-Content "$($root.FullName)\mpv.def"
          llvm-dlltool -m i386:x86-64 -d "$($root.FullName)\mpv.def" -l "$($root.FullName)\lib\mpv.lib"
          "MPV_ROOT=$($root.FullName)" >> $env:GITHUB_ENV
          "LIB=$($root.FullName)\lib;$env:LIB" >> $env:GITHUB_ENV
          "PATH=$($root.FullName)\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Build Linux
        if: runner.os == 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          export LIBRARY_PATH="$(brew --prefix mpv)/lib"
          cargo build --release --target ${{ matrix.target }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/biliguga
          cp target/${{ matrix.target }}/release/biliguga dist/biliguga/
          cp README.md dist/biliguga/
          tar -C dist -czf biliguga-${{ matrix.name }}.tar.gz biliguga

          mkdir -p dist/deb-root/DEBIAN dist/deb-root/usr/bin dist/deb-root/usr/share/applications
          sed "s/^Version:.*/Version: ${version}/" packaging/debian/control > dist/deb-root/DEBIAN/control
          install -m 0755 target/${{ matrix.target }}/release/biliguga dist/deb-root/usr/bin/biliguga
          install -m 0644 packaging/common/biliguga.desktop dist/deb-root/usr/share/applications/biliguga.desktop
          dpkg-deb --build --root-owner-group dist/deb-root "biliguga-${{ matrix.name }}.deb"

          rpm_root="$PWD/dist/rpm"
          mkdir -p "$rpm_root"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp target/${{ matrix.target }}/release/biliguga "$rpm_root/SOURCES/biliguga"
          cp packaging/common/biliguga.desktop "$rpm_root/SOURCES/biliguga.desktop"
          sed "s/^Version:.*/Version:        ${version}/" packaging/rpm/biliguga.spec > "$rpm_root/SPECS/biliguga.spec"
          rpmbuild --define "_topdir $rpm_root" --target x86_64 -bb "$rpm_root/SPECS/biliguga.spec"
          cp "$rpm_root/RPMS/x86_64/"*.rpm "biliguga-${{ matrix.name }}.rpm"

          arch_root="$PWD/dist/arch-bin"
          mkdir -p "$arch_root"
          cp target/${{ matrix.target }}/release/biliguga "$arch_root/biliguga"
          cp packaging/common/biliguga.desktop "$arch_root/biliguga.desktop"
          sed "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD-bin > "$arch_root/PKGBUILD"
          docker run --rm \
            -v "$arch_root:/build" \
            archlinux:base-devel \
            bash -lc 'useradd --create-home builder && chown -R builder:builder /build && su builder -c "cd /build && makepkg --nodeps --noconfirm --clean"'
          arch_package=$(find "$arch_root" -maxdepth 1 -type f \
            -name 'biliguga-bin-[0-9]*-x86_64.pkg.tar.zst' -print -quit)
          test -n "$arch_package"
          cp "$arch_package" "biliguga-${{ matrix.name }}.pkg.tar.zst"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/biliguga
          cp target/${{ matrix.target }}/release/biliguga dist/biliguga/
          cp README.md dist/biliguga/
          tar -C dist -czf biliguga-${{ matrix.name }}.tar.gz biliguga

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/biliguga | Out-Null
          Copy-Item target/${{ matrix.target }}/release/biliguga.exe dist/biliguga/
          Copy-Item README.md dist/biliguga/
          Copy-Item "$env:MPV_ROOT\*.dll" dist/biliguga/ -ErrorAction SilentlyContinue
          Copy-Item "$env:MPV_ROOT\bin\*.dll" dist/biliguga/ -ErrorAction SilentlyContinue
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path $inno)) {
            $inno = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $inno)) { throw 'Inno Setup compiler was not found' }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & $inno "/DAppVersion=$version" "installer\biliguga.iss"
          Copy-Item dist/biliguga-windows-x86_64-setup.exe .
          7z a biliguga-${{ matrix.name }}.zip .\dist\biliguga\* | Out-Null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: biliguga-${{ matrix.name }}
          path: |
            biliguga-${{ matrix.name }}.*
            biliguga-${{ matrix.name }}-setup.exe

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: biliguga-*
          merge-multiple: true

      - name: Generate AUR binary package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive_sha=$(sha256sum dist/biliguga-linux-x86_64.tar.gz | awk '{print $1}')
          desktop_sha=$(sha256sum packaging/common/biliguga.desktop | awk '{print $1}')
          mkdir -p dist/aur
          sed \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/sha256sums=('SKIP' 'SKIP')/sha256sums=('${archive_sha}' '${desktop_sha}')/" \
            packaging/arch/PKGBUILD > dist/aur/PKGBUILD
          sed \
            -e "s/^pkgver = .*/\\tpkgver = ${version}/" \
            -e "s|/v[0-9][^/]*/|/v${version}/|g" \
            -e "0,/sha256sums = SKIP/s//sha256sums = ${archive_sha}/" \
            -e "s/sha256sums = SKIP/sha256sums = ${desktop_sha}/" \
            packaging/arch/.SRCINFO > dist/aur/.SRCINFO
          tar -C dist/aur -czf dist/biliguga-linux-x86_64-aur.tar.gz PKGBUILD .SRCINFO

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "biliguga $GITHUB_REF_NAME"

      - name: Publish binary package to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo 'AUR_SSH_PRIVATE_KEY is not configured; the AUR package was generated in the Release assets only.'
            exit 0
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -H aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"

          if ! git clone "ssh://aur@aur.archlinux.org/biliguga-bin.git" aur-repo; then
            mkdir -p aur-repo
            git -C aur-repo init -b master
            git -C aur-repo remote add origin "ssh://aur@aur.archlinux.org/biliguga-bin.git"
          fi
          cp dist/aur/PKGBUILD dist/aur/.SRCINFO aur-repo/
          git -C aur-repo config user.name 'jlvihv'
          git -C aur-repo config user.email 'jlvihv@users.noreply.github.com'
          git -C aur-repo add PKGBUILD .SRCINFO
          if git -C aur-repo diff --cached --quiet; then
            echo 'AUR package is already up to date.'
            exit 0
          fi
          git -C aur-repo commit -m "更新至 ${GITHUB_REF_NAME}"
          git -C aur-repo push origin master
