name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-mpv

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Build Linux
        if: runner.os == 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:/usr/bin:$PATH"
          cargo build --release --target ${{ matrix.target }}

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          export LIBRARY_PATH="$(brew --prefix mpv)/lib"
          cargo build --release --target ${{ matrix.target }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/biliguga
          cp target/${{ matrix.target }}/release/biliguga dist/biliguga/
          cp README.md dist/biliguga/
          tar -C dist -czf biliguga-${{ matrix.name }}.tar.gz biliguga

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/biliguga
          cp target/${{ matrix.target }}/release/biliguga dist/biliguga/
          cp README.md dist/biliguga/
          tar -C dist -czf biliguga-${{ matrix.name }}.tar.gz biliguga

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:/mingw64/bin:/usr/bin:$PATH"
          mkdir -p dist/biliguga
          cp target/${{ matrix.target }}/release/biliguga.exe dist/biliguga/
          cp README.md dist/biliguga/
          cp /mingw64/bin/libmpv-2.dll dist/biliguga/
          7z a biliguga-${{ matrix.name }}.zip ./dist/biliguga/*

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: biliguga-${{ matrix.name }}
          path: biliguga-${{ matrix.name }}.*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: biliguga-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "biliguga $GITHUB_REF_NAME"
