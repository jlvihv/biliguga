name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev \
            libjemalloc-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config

      - name: Install Windows libmpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-(?!v3-).*\.7z$' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
          }
          if (-not $asset) { throw 'No x86_64 mpv-dev asset found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\mpv-dev.7z"
          7z x "$env:RUNNER_TEMP\mpv-dev.7z" -o"$env:RUNNER_TEMP\mpv-dev" -y | Out-Null
          $root = Get-ChildItem "$env:RUNNER_TEMP\mpv-dev" -Directory | Select-Object -First 1
          if (-not $root) { $root = Get-Item "$env:RUNNER_TEMP\mpv-dev" }
          "MPV_ROOT=$($root.FullName)" >> $env:GITHUB_ENV
          "LIB=$($root.FullName)\lib;$env:LIB" >> $env:GITHUB_ENV
          "PATH=$($root.FullName)\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv

      - name: Build Linux
        if: runner.os == 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          export LIBRARY_PATH="$(brew --prefix mpv)/lib"
          cargo build --release --target ${{ matrix.target }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/biliguga
          cp target/${{ matrix.target }}/release/biliguga dist/biliguga/
          cp README.md dist/biliguga/
          tar -C dist -czf biliguga-${{ matrix.name }}.tar.gz biliguga

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/biliguga
          cp target/${{ matrix.target }}/release/biliguga dist/biliguga/
          cp README.md dist/biliguga/
          tar -C dist -czf biliguga-${{ matrix.name }}.tar.gz biliguga

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/biliguga | Out-Null
          Copy-Item target/${{ matrix.target }}/release/biliguga.exe dist/biliguga/
          Copy-Item README.md dist/biliguga/
          Copy-Item "$env:MPV_ROOT\bin\*.dll" dist/biliguga/ -ErrorAction SilentlyContinue
          7z a biliguga-${{ matrix.name }}.zip .\dist\biliguga\* | Out-Null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: biliguga-${{ matrix.name }}
          path: biliguga-${{ matrix.name }}.*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: biliguga-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "biliguga $GITHUB_REF_NAME"
