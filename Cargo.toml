[package]
name = "biliguga"
version = "0.1.1"
edition = "2024"
description = "A small native GPUI client for Bilibili"
license = "MIT"

[dependencies]
futures = "0.3"
gpui = { version = "0.2.2", features = ["macos-blade"] }
image = "0.25"
md-5 = "0.10"
percent-encoding = "2"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
smallvec = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "time"] }
url = "2"
