[package]
name = "biliguga"
version = "0.1.1"
edition = "2024"
description = "A small native Rune client for Bilibili"
license = "MIT"

[dependencies]
futures = "0.3"
image = "0.25"
md-5 = "0.10"
percent-encoding = "2"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "time"] }
url = "2"
