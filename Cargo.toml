[package]
name = "biliguga"
version = "0.1.0"
edition = "2024"
description = "A small native GPUI client for Bilibili"
license = "MIT"

[patch.crates-io]
gpui = { path = "vendor/gpui" }

[dependencies]
futures = "0.3"
gpui = "0.2.2"
image = "0.25"
md-5 = "0.10"
percent-encoding = "2"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
smallvec = "1"
url = "2"
